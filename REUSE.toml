    "src/gpu-pack/containers/converter-agpl/**",
    "src/workstation/library/src/render/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jeffrey A. Cummings"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documentation, including the Markdown files inside the converter folder (its NOTICE says so), the design document,
