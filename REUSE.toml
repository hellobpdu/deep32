# The copyright holders and the license of every file in this repository, in the REUSE 3.3 format
# (https://reuse.software/spec-3.3/).
#
# Most files carry no header of their own, so I record their copyright holder and license here. When more than one
# entry matches a file, the last one wins, so the list runs from the general rule to the exceptions. With
# precedence "closest", a header inside a file (for example the SPDX lines in the PDF converter and in e26-render)
# comes first and this file fills in only what the header leaves out. With "override", this file alone applies. I use
# it for copies of license texts and for files whose text the REUSE tool would misread as a notice, such as a pattern
# that removes a publisher's footer.
#
# licenses/LICENSING.md explains which license covers what, and notices/THIRD-PARTY-NOTICES.md lists the third-party
# components. LicenseRef-HPE-Permission and LicenseRef-Microsoft-Permission mark material from Hewlett Packard
# Enterprise and from Microsoft that I use with their permission; it is not covered by this project's licenses.

version = 1

