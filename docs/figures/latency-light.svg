<line x1="464.2857142857143" y1="44" x2="464.2857142857143" y2="196" stroke="#d1d9e0" stroke-dasharray="2 4"/>
<text x="464.2857142857143" y="214" class="m" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">200 ms</text>
<line x1="596.4285714285714" y1="44" x2="596.4285714285714" y2="196" stroke="#d1d9e0" stroke-dasharray="2 4"/>
<text x="596.4285714285714" y="214" class="m" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">300 ms</text>
<line x1="728.5714285714286" y1="44" x2="728.5714285714286" y2="196" stroke="#d1d9e0" stroke-dasharray="2 4"/>
<text x="728.5714285714286" y="214" class="m" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">400 ms</text>
<line x1="860.7142857142857" y1="44" x2="860.7142857142857" y2="196" stroke="#d1d9e0" stroke-dasharray="2 4"/>
<text x="860.7142857142857" y="214" class="m" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">500 ms</text>
<text x="24" y="69" class="s" font-size="14.5" font-weight="400" fill="#1f2328">Keyword leg</text>
