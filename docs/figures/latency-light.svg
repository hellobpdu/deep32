<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="226" viewBox="0 0 1000 226" role="img" aria-labelledby="t d">
<title id="t">Anatomy of one reranked search</title>
<desc id="d">Approximate timeline of a median reranked search, derived from the medians of separate runs on 2 November 2026: the keyword leg (BM25) takes about 125 ms and the vector leg (query embedding and exact scan) about 122 ms, in parallel; fusion and folding end at about 140 ms; the cross-encoder reranks the top 15 until about 542 ms.</desc>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Anatomy of one reranked search</dc:title><dc:creator>Jeffrey A. Cummings</dc:creator><dc:rights>Copyright (C) 2026 Jeffrey A. Cummings</dc:rights><dc:source>https://github.com/hellobpdu/deep32</dc:source></rdf:Description></rdf:RDF></metadata>
