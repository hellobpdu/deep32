<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="t d">
<title id="t">Deep32 deployment topology</title>
<desc id="d">Three parts on the user's own Tailscale network, with MagicDNS and HTTPS. The headend runs the agent (Claude Code or Codex) with its research skill, MCP client and the Ask relay; it reaches the Workstation's MCP gateway over HTTPS with an agent token. The Workstation, an OpenBSD node installed from disc 1 with disc 2's content, runs the MCP gateway with 11 tools, the hybrid search engine, the prebuilt index generation and the Ask window and Library. The Forge, installed from disc 3 in Docker on an NVIDIA machine, runs the embedding and reranking models and, optionally, the PDF converter and index builder; the Workstation calls it over HTTPS with a bearer token. The parts are paired once with a short code using SPAKE2 (RFC 9382). Only the hosted language model is outside: it receives the question and the retrieved passages. The three parts can share one machine or run on three.</desc>
