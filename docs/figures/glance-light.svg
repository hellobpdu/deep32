<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="138" viewBox="0 0 1000 138" role="img" aria-labelledby="t d">
<title id="t">Deep32 at a glance</title>
<desc id="d">Five figures. Hit at 1: 0.955, the correct passage ranked first. Hit at 8: 0.991, the correct passage in the top eight. 854 documents: 365 RFCs and 489 Cisco documents. 11 MCP tools, used by Claude Code and Codex. Median search time 542 milliseconds with hybrid search and reranking. Measured on 696 labeled questions through the gateway on 2 November 2026.</desc>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Deep32 at a glance</dc:title><dc:creator>Jeffrey A. Cummings</dc:creator><dc:rights>Copyright (C) 2026 Jeffrey A. Cummings</dc:rights><dc:source>https://github.com/hellobpdu/deep32</dc:source></rdf:Description></rdf:RDF></metadata>
