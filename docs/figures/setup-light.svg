<text x="24" y="201" class="m" font-size="12.5" fill="#f2efe9">Rename this machine to deep32-forge on your tailnet? [y/N] <tspan font-weight="700">y</tspan></text>
<text x="24" y="222" class="m" font-size="12.5" fill="#f2efe9"><tspan font-weight="700" fill="#a3e39d">[ok]</tspan> renamed to deep32-forge</text>
