<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="351" viewBox="0 0 1000 351" role="img" aria-labelledby="t d">
<title id="t">Deep32 setup on a Forge host</title>
<desc id="d">A terminal window with a shortened run of the one-command setup, bash install/deep32-setup.sh, on a GPU machine. Every line the script prints starts with a tag. Info: this machine looks like a forge host. OK: gpgv for the signature checks; NVIDIA GeForce RTX 4070, class ada; 12282 MiB of GPU memory, and the Forge needs 10752; Docker running. Fix: the Tailscale name gpu-pc must start with deep32- for the Workstation to offer it. The script asks whether to rename the machine to deep32-forge on the tailnet, the answer is yes, and it reports OK: renamed to deep32-forge. Info: downloading, verifying and installing the GPU pack for ada into /opt/deep32. You: the installer shows its plan (folders, ports, images, sizes) and waits for you to accept it. OK: Forge installed and running; the door answers on https://deep32-forge.your-tailnet.ts.net:443 and asks for a token. You: on the Workstation, open Pairing, choose Forge, pick deep32-forge and type the code K7QM2XWB4T, valid five minutes. The machine names, the tailnet, the card and the code are placeholders.</desc>
