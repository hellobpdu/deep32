<text x="24" y="54" class="m" font-size="12.5" fill="#f2efe9"><tspan fill="#cfc9c1">$</tspan> <tspan font-weight="700">bash install/deep32-setup.sh</tspan></text>
<text x="24" y="75" class="m" font-size="12.5" fill="#f2efe9"><tspan font-weight="700" fill="#cfc9c1">[info]</tspan> this machine looks like a forge host (name another role to override)</text>
