<text x="24" y="138" class="m" font-size="12.5" fill="#f2efe9"><tspan font-weight="700" fill="#a3e39d">[ok]</tspan> 12282 MiB of GPU memory (the Forge needs 10752)</text>
<text x="24" y="159" class="m" font-size="12.5" fill="#f2efe9"><tspan font-weight="700" fill="#a3e39d">[ok]</tspan> Docker running</text>
