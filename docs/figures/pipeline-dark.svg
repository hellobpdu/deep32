<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-labelledby="t d">
<title id="t">Deep32 retrieval pipeline</title>
<desc id="d">One call carries one to eight queries. Keyword search (BM25) and semantic search each return 50 candidates; reciprocal rank fusion keeps 30; a cross-encoder reranks the top 15; passages with identical text fold into one hit; 32 hits are delivered in three tiers of 8, 8 and 16 with windows of up to 2,400, 800 and 250 characters. Measured hit at 1 on 696 labeled questions: keyword alone 0.710, semantic alone 0.783, fused 0.822, reranked 0.955.</desc>
