<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="316" viewBox="0 0 1000 316" role="img" aria-labelledby="t d"><title id="t">Blind scores by benchmark, headline rater (out of 300)</title><desc id="d">Four systems answered the same three routing benchmarks. Each answer was graded blind against an answer key solved first from the question and the RFC and Cisco texts, on correctness 40, evidence 25, completeness 15, caution 10 and clarity 10. Totals from the headline rater, Claude Mythos 5.2: Claude 270, Deep32 268.5, Gemini 226, ChatGPT 211.5. Deep32 answered from its local corpus with web search disabled (headend gpt-6.2-sol, effort ultra); the other three used the open web.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Blind scores by benchmark, headline rater (out of 300)</dc:title><dc:creator>Jeffrey A. Cummings</dc:creator><dc:rights>Copyright (C) 2026 Jeffrey A. Cummings</dc:rights><dc:source>https://github.com/hellobpdu/deep32</dc:source></rdf:Description></rdf:RDF></metadata><style>.s{font-family:Helvetica,Arial,'Liberation Sans','Nimbus Sans',sans-serif}.m{font-family:'Lucida Console','Lucida Sans Typewriter',Monaco,'Courier New',monospace}</style><rect width="1000" height="316" rx="6" fill="#2b3036"/><text x="24" y="34" class="s" font-size="19" text-anchor="start" font-weight="bold" fill="#ede7e2">Blind scores by benchmark, headline rater (out of 300)</text><line x1="190.0" y1="62" x2="190.0" y2="236" stroke="#4d5e6e" stroke-width="1"/><text x="190.0" y="258" class="m" font-size="11" text-anchor="middle" font-weight="normal" fill="#b4b4b4">0</text><line x1="338.0" y1="62" x2="338.0" y2="236" stroke="#4d5e6e" stroke-width="1"/><text x="338.0" y="258" class="m" font-size="11" text-anchor="middle" font-weight="normal" fill="#b4b4b4">60</text><line x1="486.0" y1="62" x2="486.0" y2="236" stroke="#4d5e6e" stroke-width="1"/><text x="486.