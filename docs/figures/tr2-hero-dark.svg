<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="362" viewBox="0 0 1000 362" role="img" aria-labelledby="t d"><title id="t">Deep32 against three web-research assistants</title><desc id="d">Three routing benchmarks, one answer per system, scored by three graders. Evidence / 75, Mythos 5.2 (blind): Deep32 69, Claude 56, Gemini 40, ChatGPT 25. Total / 300, Mythos 5.2 (blind): Deep32 268.5, Claude 270, Gemini 226, ChatGPT 211.5. Total / 300, Opus 5.5 (blind): Deep32 272, Claude 276, Gemini 226, ChatGPT 220. Total / 300, GPT-6 (names visible): Deep32 293, Claude 288, Gemini 290, ChatGPT 285. Minutes per answer: Deep32 8.5 (measured), Claude ~10-15 (estimate), Gemini ~30 (estimate), ChatGPT ~5-10 (estimate). Deep32 answered from its local corpus with web search off; its headend model was gpt-6.2-sol at effort ultra. Deep32 is the only system placed first or second by every grader.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Deep32 against three web-research assistants</dc:title><dc:creator>Jeffrey A. Cummings</dc:creator><dc:rights>Copyright (C) 2026 Jeffrey A. Cummings</dc:rights><dc:source>https://github.com/hellobpdu/deep32</dc:source></rdf:Description></rdf:RDF></metadata><style>.s{font-family:Helvetica,Arial,'Liberation Sans','Nimbus Sans',sans-serif}.m{font-family:'Lucida Console','Lucida Sans Typewriter',Monaco,'Courier New',monospace}</style><rect width="1000" height="362" rx="6" fill="#2b3036"/><text x="24" y="34" class="s" font-size="19" text-anchor="start" font-weight="bold" fill="#ede7e2">Deep32 against three web-research assistants</text><text x="24" y="57" class="s" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">Three hard routing problems (OSPF, BGP, MPLS VPN), one answer per system, scored by three graders.</text><text x="24" y="76" class="s" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">Deep32 answered from its local corpus with web search off; its headend model was gpt-6.2-sol at effort ultra.</text><text x="132" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">Evidence / 75</text><text x="132" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#b4b4b4">Mythos 5.2 (blind)</text><text x="306" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">Total / 300</text><text x="306" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#b4b4b4">Mythos 5.2 (blind)</text><text x="480" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">Total / 300</text><text x="480" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#b4b4b4">Opus 5.5 (blind)</text><text x="654" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">Total / 300</text><text x="654" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#b4b4b4">GPT-6 (names visible)</text><text x="828" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">Minutes per answer</text><text x="828" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#b4b4b4">shorter is better</text><rect x="14" y="132" width="972" height="38" fill="#6cc0d6" fill-opacity="0.13" stroke="#6cc0d6" stroke-width="1"/><text x="24" y="150" class="s" font-size="14" text-anchor="start" font-weight="bold" fill="#ede7e2">Deep32</text><text x="24" y="162" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#b4b4b4">no web access</text><rect x="132" y="140" width="92.0" height="22" fill="#6cc0d6" stroke="#8399ac" stroke-width="0.6"/><text x="230.0" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">69</text><rect x="306" y="140" width="89.5" height="22" fill="#6cc0d6" stroke="#8399ac" stroke-width="0.6"/><text x="401.5" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">268.5</text><rect x="480" y="140" width="90.7" height="22" fill="#6cc0d6" stroke="#8399ac" stroke-width="0.6"/><text x="576.6666666666666" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">272</text><rect x="654" y="140" width="97.7" height="22" fill="#6cc0d6" stroke="#8399ac" stroke-width="0.6"/><text x="757.6666666666666" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">293</text><line x1="828" y1="138" x2="828" y2="164" stroke="#8399ac" stroke-width="1"/><rect x="828" y="140" width="24.2" height="22" fill="#6cc0d6" stroke="#8399ac" stroke-width="0.6"/><text x="858.1714285714286" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">8.5</text><text x="24" y="188" class="s" font-size="14" text-anchor="start" font-weight="normal" fill="#ede7e2">Claude</text><text x="24" y="200" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#b4b4b4">web research</text><rect x="132" y="178" width="74.7" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="212.66666666666669" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">56</text><rect x="306" y="178" width="90.0" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="402.0" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">270</text><rect x="480" y="178" width="92.0" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="578.0" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">276</text><rect x="654" y="178" width="96.0" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="756.0" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">288</text><line x1="828" y1="176" x2="828" y2="202" stroke="#8399ac" stroke-width="1"/><rect x="856.6" y="182" width="14.3" height="14" fill="#8d8078" fill-opacity="0.55" stroke="#ede7e2" stroke-width="1" stroke-dasharray="3 2"/><text x="876.8571428571429" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">~10-15</text><line x1="132" y1="170" x2="976" y2="170" stroke="#4d5e6e" stroke-width="1"/><text x="24" y="226" class="s" font-size="14" text-anchor="start" font-weight="normal" fill="#ede7e2">Gemini</text><text x="24" y="238" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#b4b4b4">web research</text><rect x="132" y="216" width="53.3" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="191.33333333333334" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">40</text><rect x="306" y="216" width="75.3" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="387.3333333333333" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">226</text><rect x="480" y="216" width="75.3" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="561.3333333333334" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">226</text><rect x="654" y="216" width="96.7" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="756.6666666666666" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">290</text><line x1="828" y1="214" x2="828" y2="240" stroke="#8399ac" stroke-width="1"/><rect x="913.7" y="220" width="3.4" height="14" fill="#8d8078" fill-opacity="0.55" stroke="#ede7e2" stroke-width="1" stroke-dasharray="3 2"/><text x="923.1428571428571" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">~30</text><line x1="132" y1="208" x2="976" y2="208" stroke="#4d5e6e" stroke-width="1"/><text x="24" y="264" class="s" font-size="14" text-anchor="start" font-weight="normal" fill="#ede7e2">ChatGPT</text><text x="24" y="276" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#b4b4b4">web research</text><rect x="132" y="254" width="33.3" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="171.33333333333334" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">25</text><rect x="306" y="254" width="70.5" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="382.5" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">211.5</text><rect x="480" y="254" width="73.3" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="559.3333333333334" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">220</text><rect x="654" y="254" width="95.0" height="22" fill="#8d8078" stroke="#8399ac" stroke-width="0.6"/><text x="755.0" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">285</text><line x1="828" y1="252" x2="828" y2="278" stroke="#8399ac" stroke-width="1"/><rect x="842.3" y="258" width="14.3" height="14" fill="#8d8078" fill-opacity="0.55" stroke="#ede7e2" stroke-width="1" stroke-dasharray="3 2"/><text x="862.5714285714286" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">~5-10</text><line x1="132" y1="246" x2="976" y2="246" stroke="#4d5e6e" stroke-width="1"/><text x="24" y="306" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#ede7e2">Deep32 is the only system placed first or second by every grader, and it leads on checkable evidence under both blind graders.</text><text x="24" y="325" class="s" font-size="13" text-anchor="start" font-weight="normal" fill="#ede7e2">It answered in 8.5 minutes on average, measured from its logs. Dashed spans are my estimates of the other runs, which were not timed.</text><text x="976" y="352" class="s" font-size="10" text-anchor="end" font-weight="normal" fill="#b4b4b4">Bold score = best in column. Mythos 5.2 and Opus 5.5 graded blind against an answer key; GPT-6 graded with the names visible. D32-TR-2 Section 6</text></svg>
