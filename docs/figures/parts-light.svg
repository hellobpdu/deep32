<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="184" viewBox="0 0 1000 184" role="img" aria-labelledby="t d">
<title id="t">The parts of Deep32</title>
<desc id="d">Five badges. Headend: your agent, Claude Code or Codex, on your PC. Workstation: search and archive, OpenBSD with the gateway and the Library, disc 1. Forge: the GPU powerhouse for embedding, reranking and converting, disc 3. Ask relay: the link between the Ask window and your agent, on your PC. Content: the library of RFCs, Cisco documentation and a prebuilt index, disc 2.</desc>
