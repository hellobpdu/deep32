<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="436" viewBox="0 0 1000 436" role="img" aria-labelledby="t d">
<title id="t">Deep32 architecture</title>
<desc id="d">At question time an agent (Claude Code or Codex) calls the MCP gateway on the Workstation; the gateway calls the search engine, which combines keyword search (SQLite FTS5, BM25), semantic search (an exact scan of 1024-dimension vectors), fusion and reranking, a section reader, identifier lookup and a quote check, and calls the Forge for embeddings and reranking; without the Forge it answers with BM25 alone. At build time sources are ingested, built into a new index generation and validated against 696 labeled questions before the engine switches to it, with automatic rollback.</desc>
