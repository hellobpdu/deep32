<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" role="img" aria-labelledby="t d"><title id="t">Deep32 against three web-research assistants</title><desc id="d">Three routing benchmarks, one answer per system, scored by three graders. Checkable evidence (out of 75, Mythos 5.2 (blind)): Deep32 69, Claude 56, Gemini 40, ChatGPT 25. Total score (out of 300, Mythos 5.2 (blind)): Deep32 268.5, Claude 270, Gemini 226, ChatGPT 211.5. Total score (out of 300, Opus 5.5 (blind)): Deep32 272, Claude 276, Gemini 226, ChatGPT 220. Total score (out of 300, GPT-6 (names visible)): Deep32 293, Claude 288, Gemini 290, ChatGPT 285. Deep32 answered from its local corpus with web search off; its headend model was gpt-6.2-sol at effort ultra. Deep32 is the only system placed first or second by every grader.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Deep32 against three web-research assistants</dc:title><dc:creator>Jeffrey A. Cummings</dc:creator><dc:rights>Copyright (C) 2026 Jeffrey A. Cummings</dc:rights><dc:source>https://github.com/hellobpdu/deep32</dc:source></rdf:Description></rdf:RDF></metadata><style>.s{font-family:Helvetica,Arial,'Liberation Sans','Nimbus Sans',sans-serif}.m{font-family:'Lucida Console','Lucida Sans Typewriter',Monaco,'Courier New',monospace}</style><rect width="1000" height="344" rx="6" fill="#efe7e2"/><text x="24" y="34" class="s" font-size="19" text-anchor="start" font-weight="bold" fill="#141110">Deep32 against three web-research assistants</text><text x="24" y="57" class="s" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">Three hard routing problems (OSPF, BGP, MPLS VPN), one answer per system, scored by three graders.</text><text x="24" y="76" class="s" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">Deep32 answered from its local corpus with web search off; its headend model was gpt-6.2-sol at effort ultra.</text><text x="132" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">Checkable evidence</text><text x="132" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#585858">out of 75, Mythos 5.2 (blind)</text><text x="348" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">Total score</text><text x="348" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#585858">out of 300, Mythos 5.2 (blind)</text><text x="564" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">Total score</text><text x="564" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#585858">out of 300, Opus 5.5 (blind)</text><text x="780" y="108" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">Total score</text><text x="780" y="124" class="s" font-size="11" text-anchor="start" font-weight="normal" fill="#585858">out of 300, GPT-6 (names visible)</text><rect x="14" y="132" width="972" height="38" fill="#2e6e82" fill-opacity="0.13" stroke="#2e6e82" stroke-width="1"/><text x="24" y="150" class="s" font-size="14" text-anchor="start" font-weight="bold" fill="#141110">Deep32</text><text x="24" y="162" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#585858">no web access</text><rect x="132" y="140" width="127.0" height="22" fill="#2e6e82" stroke="#767676" stroke-width="0.6"/><text x="264.96" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">69</text><rect x="348" y="140" width="123.5" height="22" fill="#2e6e82" stroke="#767676" stroke-width="0.6"/><text x="477.51" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">268.5</text><rect x="564" y="140" width="125.1" height="22" fill="#2e6e82" stroke="#767676" stroke-width="0.6"/><text x="695.12" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">272</text><rect x="780" y="140" width="134.8" height="22" fill="#2e6e82" stroke="#767676" stroke-width="0.6"/><text x="920.78" y="155.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">293</text><text x="24" y="188" class="s" font-size="14" text-anchor="start" font-weight="normal" fill="#141110">Claude</text><text x="24" y="200" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#585858">web research</text><rect x="132" y="178" width="103.0" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="241.04000000000002" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">56</text><rect x="348" y="178" width="124.2" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="478.2" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">270</text><rect x="564" y="178" width="127.0" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="696.96" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">276</text><rect x="780" y="178" width="132.5" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="918.48" y="193.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">288</text><line x1="132" y1="170" x2="976" y2="170" stroke="#cad7e2" stroke-width="1"/><text x="24" y="226" class="s" font-size="14" text-anchor="start" font-weight="normal" fill="#141110">Gemini</text><text x="24" y="238" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#585858">web research</text><rect x="132" y="216" width="73.6" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="211.6" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">40</text><rect x="348" y="216" width="104.0" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="457.96" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">226</text><rect x="564" y="216" width="104.0" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="673.96" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">226</text><rect x="780" y="216" width="133.4" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="919.4" y="231.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">290</text><line x1="132" y1="208" x2="976" y2="208" stroke="#cad7e2" stroke-width="1"/><text x="24" y="264" class="s" font-size="14" text-anchor="start" font-weight="normal" fill="#141110">ChatGPT</text><text x="24" y="276" class="s" font-size="10" text-anchor="start" font-weight="normal" fill="#585858">web research</text><rect x="132" y="254" width="46.0" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="184.0" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">25</text><rect x="348" y="254" width="97.3" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="451.29" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">211.5</text><rect x="564" y="254" width="101.2" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="671.2" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">220</text><rect x="780" y="254" width="131.1" height="22" fill="#a89a90" stroke="#767676" stroke-width="0.6"/><text x="917.1" y="269.4" class="m" font-size="13" text-anchor="start" font-weight="normal" fill="#141110">285</text><line x1="132" y1="246" x2="976" y2="246" stroke="#cad7e2" stroke-width="1"/><text x="24" y="306" class="s" font-size="13" text-anchor="start" font-weight="bold" fill="#141110">Deep32 is the only system placed first or second by every grader, and it leads on checkable evidence under both blind graders.</text><text x="976" y="334" class="s" font-size="10" text-anchor="end" font-weight="normal" fill="#585858">Bold = best in column. Mythos 5.2 and Opus 5.5 graded blind against an answer key; GPT-6 graded with the names visible. D32-TR-2 Section 6</text></svg>
