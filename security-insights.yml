repository:
  url: https://github.com/hellobpdu/deep32
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: Jeffrey A. Cummings
      email: jacummings@acm.org
      social: https://github.com/hellobpdu
      primary: true
  license:
    url: https://github.com/hellobpdu/deep32/blob/main/licenses/LICENSING.md
    expression: Apache-2.0 AND AGPL-3.0-or-later AND CC-BY-4.0
  documentation:
    contributing-guide: https://github.com/hellobpdu/deep32/blob/main/.github/CONTRIBUTING.md
    security-policy: https://github.com/hellobpdu/deep32/blob/main/.github/SECURITY.md
  release:
    automated-pipeline: false
    distribution-points:
      - uri: https://github.com/hellobpdu/deep32/releases
        comment: GitHub releases, with the signed checksum lists and the release metadata.
      - uri: https://archive.org/details/deep32-0.1.0-alpha.2
        comment: Internet Archive item with the images of 0.1.0-alpha.2, also offered as a torrent.
    changelog: https://github.com/hellobpdu/deep32/blob/main/CHANGELOG.md
    attestations:
      - name: Software bill of materials for each image
        location: https://github.com/hellobpdu/deep32/releases/tag/v{version}
        predicate-uri: https://spdx.dev/Document
        comment: |
          SPDX 2.3, one for every image. Replace {version} with the release, for example 0.1.0-alpha.2. Each
          release's checksum list (SHA256SUMS) is signed with the OpenPGP key B205B406548627AABF5250D8A078C5F25D025DD6,
          and deep32-get checks that signature before it uses any hash in the list.
      - name: OpenVEX document for each release
        location: https://github.com/hellobpdu/deep32/blob/main/docs/security/deep32-{version}.openvex.json
        predicate-uri: https://openvex.dev/ns/v0.2.0
        comment: |
          Whether each known vulnerability OSV-Scanner reports in a pinned package affects Deep32, and why. Replace
          {version} with the release, for example 0.1.0-alpha.2. docs/security/README.md describes the triage.
  security:
    assessments:
      self:
        comment: |
          The OpenSSF Best Practices answers are kept in .bestpractices.json. README section 10, SECURITY.md and the
          design document D32-TR-1 describe the security design, docs/ASSURANCE-CASE.md argues it claim by claim, and
          docs/SECURITY-REVIEW-2026-11.md records the security review of November 2026.
        evidence: https://github.com/hellobpdu/deep32/blob/main/.bestpractices.json
        date: '2026-11-19'
    champions:
      - name: Jeffrey A. Cummings
        email: jacummings@acm.org
        primary: true
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: Python and C, on every push and pull request to main and weekly.
      - name: Bandit
        type: SAST
        version: 1.9.4
        rulesets:
          - .github/bandit.yaml
        integration:
          adhoc: false
          ci: true
          release: true
        results: {}
        comment: Reports findings that are not in the reviewed baseline, .github/bandit-baseline.json.
      - name: Ruff
        type: SAST
        version: 0.17.5
        rulesets:
          - ruff.toml
        integration:
          adhoc: false
          ci: true
          release: true
        results: {}
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: Weekly and on each push to main.
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: Weekly version updates for the GitHub Actions the workflows use.
      - name: OSV-Scanner
        type: SCA
        version: 2.7.1
        rulesets:
          - osv-scanner.toml
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The pinned Python packages, on every push and pull request to main and weekly
          (.github/workflows/osv-scanner.yml). osv-scanner.toml leaves out, for the image pins only, the advisories the
          release's OpenVEX document in docs/security/ marks not_affected. A known vulnerability in the pins outside
          the images fails the workflow.
      - name: libFuzzer
        type: fuzzing
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The Workstation's C parsers with AddressSanitizer and UndefinedBehaviorSanitizer, on every push and pull
          request to main and weekly (tests/fuzz/README.md, .github/workflows/fuzz.yml).
