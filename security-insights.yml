header:
  schema-version: 2.2.0
  last-updated: '2026-11-19'
  last-reviewed: '2026-11-19'
  url: https://raw.githubusercontent.com/hellobpdu/deep32/main/security-insights.yml
  comment: |
    Security Insights for Deep32, one repository. Facts here follow SECURITY.md, README.md and the release notes.

