# /etc/d32/relayd.conf: the TLS front for deep32-gateway (Deep32 node, rc.d/d32front). OFF at First light.
# Zero trust (ISO-DESIGN 13): "remotely it can only make queries". relayd passes exactly
#   POST /mcp     -> deep32-gateway, whose RemoteGate allows initialize, ping, tools/list and the 11 read tools
#   GET  /health  -> deep32-gateway's public health line
# and refuses every other method and path (no admin, no docs, no deep32-engine path: deep32-engine is not reachable from
# here at all, it listens only on a UNIX socket). relayd terminates TLS, replaces any client-supplied
# X-Forwarded-For with the real peer address (deep32-gateway's IP allow-list and logs then see the caller, as behind
# Tailscale Serve in production) and drops the other forwarding headers.
#
# front_addr: where remote callers connect. The test uses loopback. Exposing it on the tailnet needs a pf
# `pass in` rule for this port and a pf exception for _d32edge's 127.0.0.1:8766 (BASE blocks _d32edge's TCP):
# that is a zero-trust decision for the owner, not a default.

front_addr="127.0.0.1"
front_port="7766"
edge_port="8766"

log connection errors
prefork 1

http protocol "d32edge" {
	tls keypair "d32front"
	return error

	# who is calling: relayd says, the client does not
	match request header set "X-Forwarded-For" value "$REMOTE_ADDR"
	match request header set "X-Forwarded-Proto" value "https"
	match request header remove "Forwarded"
	match request header remove "X-Forwarded-Host"
	match request header remove "X-Real-IP"

	# default: refuse. For block/pass the last matching rule decides; the two quick passes end the evaluation.
	block request
	pass request quick method POST path pattern "^/mcp$"
	pass request quick method GET path pattern "^/health$"

	http { headerlen 8192 }
	tcp { nodelay, backlog 64 }
}

relay "d32front" {
	listen on $front_addr port $front_port tls
	protocol "d32edge"
	forward to 127.0.0.1 port $edge_port
	session timeout 180
}
