# /etc/d32/ready.conf: what d32ready accepts on this node (update 2; schg, like every /etc/d32/*.conf, so it changes
# only in a boot window). One rule per line; "#" starts a comment. d32ready -h lists the checks.

# the level rc.securelevel sets (HARDENING-REVIEW 3.2: 1, OpenBSD's default)
securelevel 1

# /etc/hostname.* files allowed. None: LAN only, no NIC comes up at boot (item 56). Example: hostname em0
#hostname em0

# a default route, or autoconf on an interface: warn (item 56, LAN only; item 58 found the route coming back)
default_route warn
# daemons that must not run (item 58: dhcpleased_flags=NO since update 1)
off dhcpleased
#off slaacd

# boot inputs hashed into the baseline, besides every file /etc/d32/schg.list names
input /etc/boot.conf
input /etc/ttys
input /etc/ssh/sshd_config
input /etc/signify/openbsd-*.pub

# directories that must carry schg (update 1's static directories, ship/u1/bundle/u1-lib.sh SCHGDIRS)
schgdir /usr/local/d32/sbin
schgdir /usr/local/d32/ship/libexec
schgdir /etc/d32/site.d
schgdir /etc/login.conf.d
schgdir /etc/rc.d
schgdir /etc/X11/xorg.conf.d
schgdir /etc/dt/config/Xsession.d

# sockets allowed on all addresses: listen <command> <protocol> [<port>]; globs; protocol tcp, tcp6, udp, udp6.
# pf has no inbound rule for any of them; this is the list of what may sit behind it (U43 moves CDE to loopback later,
# then these lines go). Seen on the node on 2026-11-06 (fstat -n, read-only): portmap 111; slaacd's IPv6 socket;
# the CDE session's ToolTalk ports (random, so no port): ttsession, dtsession, dtwm, dtfile, dtexec.
listen portmap tcp 111
listen portmap udp 111
listen slaacd udp6 0
listen ttsession tcp
listen ttsession tcp6
listen dt* tcp
listen dt* tcp6

# days without an update before the Updates line warns (ISO-DESIGN 12.3 item 6)
update_age 90
