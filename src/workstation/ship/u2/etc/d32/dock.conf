# /etc/d32/dock.conf: Deep32/UX dock, lid and screen policy (update 2, lid and dock lane). Read by d32-dock (root,
# from hotplugd, rc.local and apmd) and d32-display (root at the login screen, the user in a session). KEY=value
# lines, parsed and checked, never run. schg (/etc/d32/*.conf): a change goes in with an update, in the boot window.

# The dock: present if any of these is. The WD19's NIC (ure0) and its USB ids (four "Dell dock" hubs, two HID).
DOCK_MACS=90:8d:6e:3a:ba:e7
DOCK_USB_IDS=0bda:0487 0bda:0413 0bda:5487 0bda:5413 413c:b06e 413c:b06f

# machdep.lidaction for each state: 0 nothing, 1 suspend (S0ix, the only sleep state this laptop has), 2 hibernate.
# Both 0: a lid-close suspend hung this laptop on 2026-11-06. Leave them at 0 until d32-docktest's supervised
# suspend test passes with the DMC firmware from update 1, and hibernate (2) until a ZZZ test passes.
LID_DOCKED=0
LID_UNDOCKED=0
# Lock the CDE session when the dock is pulled; redo the screen layout when it arrives.
LOCK_ON_UNDOCK=yes
LAYOUT_ON_DOCK=yes
# Seconds to wait after a hotplug event for the rest of the dock's devices to come or go (0-9). An unplug takes
# them all within a fraction of a second; if some are still there, the later events of the burst decide.
SETTLE=1

# Screens. The panel is the output matching PANEL_OUTPUT; any other output reported connected with modes is an
# external monitor. With one: mirror (the panel shows the top-left of the desktop), off, or auto (off with the lid
# closed, mirror with it open). The login screen never switches the panel off by default: the box must stay visible
# even if the monitor only claims to be connected.
PANEL_OUTPUT=eDP*
PANEL_GREETER=mirror
PANEL_SESSION=auto
PANEL_DOCK=mirror
# Outputs to prefer as primary when several are connected (xrandr names, in order); empty: xrandr's own order.
PREFER=
# Seconds to wait for the dock's monitor after the dock arrives (DP Alt Mode comes up after the USB side).
DOCK_WAIT=12
# yes: restart dtwm (as Style Manager does) when a mid-session dock change resizes the screen, so the front panel
# follows (dtwm places it once, at start: after an undock it would sit below the panel). Windows and workspaces stay.
# Proved with this CDE build in a nested X server on the build VM; no turns it off.
RESTART_WM=yes
