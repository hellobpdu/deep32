# /etc/doas.conf: Deep32 Workstation (BASE lane; schg). Last match wins [doas.conf(5)].
# No "persist" and no "keepenv" anywhere: every privileged step asks the user's password (ISO 3.6). "nopass" as root only
# for the lowering verbs (DISTRO 3.5); otherwise "nopass" only to a less trusted domain user (d32web,
# d32net), never to root. doas passes DISPLAY only; each wrapper sets its domain's own XAUTHORITY (FIX-21).
# Every target lives in /usr/local/d32/sbin (schg). Trust-changing verbs also check that they run on the wscons
# console (ttyC*), so a pty or an X client cannot reach them through these rules.
# Targets that are not installed yet simply fail with "command not found"; the rules are inert until then.

# admin verbs: routine ones in X with the user's password, trust-changing ones refused unless on the console
permit @D32_USER@ as root cmd /usr/local/d32/sbin/deep32ctl
permit @D32_USER@ as root cmd /usr/local/d32/sbin/uplinkctl
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32upd
# lowering verbs: no password (lowering trust harms nothing)
permit nopass @D32_USER@ as root cmd /usr/local/d32/sbin/deep32ctl args web off
permit nopass @D32_USER@ as root cmd /usr/local/d32/sbin/deep32ctl args privacy mic off
permit nopass @D32_USER@ as root cmd /usr/local/d32/sbin/deep32ctl args privacy cam off
permit nopass @D32_USER@ as root cmd /usr/local/d32/sbin/deep32ctl args bench stop
# argument-checking root wrappers, never doas on the raw tool (ISO 2.6.4)
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-capture
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-cdp
# domain launchers (DISTRO 3.5, FIX-14, FIX-21), each to a less trusted user, never root. One takes no arguments
# ("args" with nothing after it): fathom-run. The other three accept any arguments, so each launcher
# must check its own: two take them by design, d32sess-connect <profile-id> (DISTRO 3.4) and view-untrusted <type>
# <path> (DISTRO 3.7); wireshark-run reads its
# capture on stdin (FIX-24) and gets "args" once DIST-APPS fixes its interface.
permit nopass setenv { DISPLAY } @D32_USER@ as d32web cmd /usr/local/d32/sbin/fathom-run args
permit nopass setenv { DISPLAY } @D32_USER@ as d32web cmd /usr/local/d32/sbin/view-untrusted
permit nopass setenv { DISPLAY } @D32_USER@ as d32net cmd /usr/local/d32/sbin/d32sess-connect
permit nopass setenv { DISPLAY } @D32_USER@ as d32net cmd /usr/local/d32/sbin/wireshark-run
permit nopass setenv { DISPLAY } @D32_USER@ as d32net cmd /usr/local/d32/sbin/view-untrusted

# Update 4 (D.32.12u4, items 64 and 66): the link and Ask's password pairing, each with the user's password every time (no
# nopass, no persist, no keepenv). d32-link takes any of its verbs (on, off, enable, disable, login, status); the
# pairing takes exactly these two forms, from a normal Terminal (T-0029: the pairing password is read from the
# controlling terminal, never from arguments or the environment).
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-link
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-chatctl args pair home
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-chatctl args pair work

# The Workstation screens. The First Start window reads the first start's status line through d32-setup-status: no
# arguments, nothing changed, so no password, and nolog because the window asks every two seconds. Pairing
# (d32-pairdesk) and carrying on an import of disc 2 (d32-import-resume) change what this Workstation trusts or
# holds: each asks the user's password every time, in a Terminal, as Ask's pairing does. d32-pairdesk checks its
# own arguments (none, -forge, -relay or -headend).
permit nopass nolog @D32_USER@ as root cmd /usr/local/d32/sbin/d32-setup-status args
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-pairdesk
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-import-resume args
# Get Disc 2 over the Network (First Start, d32-content-get): root's d32-content-fetch writes the download to the
# spare system slot, so it asks the user's password every time. No arguments: its own screens only.
permit @D32_USER@ as root cmd /usr/local/d32/sbin/d32-content-fetch args
