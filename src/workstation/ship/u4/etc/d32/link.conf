# /etc/d32/link.conf: d32-link's settings. schg (/etc/d32/*.conf): changed only in a boot window.
# key=value, one per line; d32-link refuses anything else.
# hub: the tailnet address (IPv4) of the PC or Forge this node is paired with, set when pairing. No default:
# while it is empty the link still brings up DHCP and Tailscale, and nothing is opened towards a hub.
hub=
# the wired ports, in order of preference (set by the hardware profile)
ports=em0 ure0
# this node's Tailscale host name
hostname=deep32
interval=10
# Empty unless selected at install; one public ssh-ed25519 key.
maint_key=
