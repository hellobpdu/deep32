# /etc/ntpd.conf: Deep32 Workstation. Time comes only from the hub set at pairing (its server line is written then),
# over the tailnet wherever d32-link is up. No public server, ever. By address: no daemon on the node resolves
# names. pf lets only _ntp reach the <ntp> table (/etc/d32/pf/ntp; keep the two in step). HTTPS constraints are
# off: they need HTTPS from _ntp, which pf refuses. With no server, ntpd waits; the RTC keeps the time.
sensor *
