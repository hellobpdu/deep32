# Deep32/UX font path (update 1). Xorg keeps only the last Files section of xorg.conf.d; this one, sorted last,
# holds the whole path: Deep32 faces, VUE faces, the private Windows 3.1 and Library faces, then the X11 directories.
Section "Files"
    FontPath "/usr/local/share/fonts/d32hp/"
    FontPath "/usr/local/share/fonts/hpvue/"
    FontPath "/usr/local/share/fonts/d32private/pcf/"
    FontPath "/usr/local/share/fonts/d32private/ttf/"
    FontPath "/usr/X11R6/lib/X11/fonts/misc/"
    FontPath "/usr/X11R6/lib/X11/fonts/100dpi/:unscaled"
    FontPath "/usr/X11R6/lib/X11/fonts/75dpi/:unscaled"
    FontPath "/usr/X11R6/lib/X11/fonts/Type1/"
    FontPath "/usr/X11R6/lib/X11/fonts/TTF/"
    FontPath "/usr/X11R6/lib/X11/fonts/OTF/"
EndSection
