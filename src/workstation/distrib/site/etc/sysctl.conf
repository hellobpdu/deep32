# /etc/sysctl.conf: Deep32 Workstation (BASE lane; schg). ISO-DESIGN 2.8 and DISTRO 8.3.
# Set explicitly even where they equal OpenBSD's defaults, so the first-boot check can prove each one.
ddb.panic=0		# no kernel debugger on panic: ddb gives kernel memory at the console
ddb.console=0		# no ddb from the console break key (neither may be raised at securelevel 1+)
kern.allowkmem=0	# no /dev/kmem reads
kern.allowdt=0		# no dt(4) tracing
kern.global_ptrace=0	# ptrace only of one's own children
kern.nosuidcoredump=1	# no core files from set-id programs
machdep.allowaperture=0	# inteldrm and the VM framebuffer need no aperture (DISTRO 8.3)
net.inet.ip.forwarding=0	# the compat cell turns this on only while it runs (FIX-10)
net.inet6.ip6.forwarding=0
kern.audio.record=0	# privacy: microphone off until "privacy mic on" (DISTRO 8.2)
kern.video.record=0	# privacy: camera off until "privacy cam on"
machdep.lidaction=0	# lid close does nothing (update 1, U01): suspend to S0ix hung the Latitude 5430; shut it down before packing it
