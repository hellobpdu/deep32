# /var/unbound/etc/unbound.conf: Deep32 Workstation (BASE lane). ISO-DESIGN 2.6.3 as amended by DISTRO C9: one full
# resolver on loopback, and pf decides who may ask it: root (tailscaled) always, d32web only while the Web switch is
# DIRECT, d32net only while Lab DNS is on; everyone else gets "block return" on lo0 port 53, so the desktop user and every daemon
# resolve nothing. Upstreams come from the DHCP lease (d32-dnsup writes d32-forward.conf and fills pf <dns>); only
# _unbound may reach them. No query or reply is logged.
# Update 1 (U27, item 56): every name is REFUSED here except Tailscale's (the tailnet is the node's only outside
# world, item 46); the built-in localhost zones still answer. With the LAN-only link there is no lease and so no
# upstream at all: the router's resolver is never asked (d32-dnsup forwards only for an AUTOCONF4 interface).
server:
	local-zone: "." refuse
	local-zone: "tailscale.com." transparent
	# Let's Encrypt ACME: tailscaled fetches the HTTPS certificate that publishing the gateway needs (d32-publish)
	local-zone: "acme-v02.api.letsencrypt.org." transparent
	# the release mirror of disc 2 (d32-content-fetch --mirror): archive.org and the servers it sends a download to;
	# pf lets root reach them only while a download runs (table <d32_fetch>)
	local-zone: "archive.org." transparent
	interface: 127.0.0.1
	interface: ::1
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: ::0/0 refuse
	access-control: ::1 allow
	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
	harden-glue: yes
	# Many home routers forward DNS without its DNSSEC records. With this on, every answer through them is bogus
	# (SERVFAIL), so Tailscale could not renew and the gateway certificate could not be fetched. Validation still
	# applies when the upstream passes DNSSEC; the names allowed above are only reached over authenticated TLS.
	harden-dnssec-stripped: no
	aggressive-nsec: yes
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	val-log-level: 1
	log-queries: no
	log-replies: no
	verbosity: 1

remote-control:
	control-enable: yes
	control-interface: /var/run/unbound.sock

# forward-zone "." with the DHCP lease's resolvers, rewritten by /usr/local/d32/sbin/d32-dnsup (empty until then)
include: "/var/unbound/etc/d32-forward.conf"
