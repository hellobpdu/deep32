# OSV-Scanner configuration for the all-pins job of .github/workflows/osv-scanner.yml, which passes it with
# --config so that it applies to every pin file in the tree. Each entry below is an advisory that the OpenVEX
# document docs/security/deep32-0.1.0-alpha.2.openvex.json marks not_affected for 0.1.0-alpha.2, with the
# justification from that document; docs/security/README.md says how the triage was done. Ignoring one ID of an
# advisory also ignores its aliases (GHSA, PYSEC, CVE). The entries expire on effectiveUntil, after which the
# findings show again until they are triaged again or the pins move. The changeable-pins job does not use this
# file, so any known vulnerability in those pins still fails the workflow.

